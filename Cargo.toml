[package]
name = "sessmove"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Move a project directory and rewrite every AI coding agent's local session/config references to it, in one step"
license = "GPL-3.0-or-later"
repository = "https://github.com/fly88oj/sessmove"
keywords = ["ai", "agent", "cli", "migration", "sessions"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[lib]
name = "sessmove"
path = "src/lib.rs"

[[bin]]
name = "sessmove"
path = "src/bin/sessmove.rs"

[[bin]]
name = "agentpath"
path = "src/bin/agentpath.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
memchr = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
rust-i18n = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
md-5 = "0.10"
sys-locale = "0.3"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = "symbols"
opt-level = 3

# ---- native packages (cargo-deb / cargo-generate-rpm) ----

[package.metadata.deb]
maintainer = "sessmove contributors"
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/sessmove", "usr/bin/", "755"],
    ["target/release/agentpath", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/sessmove/", "644"],
    ["LICENSE", "usr/share/doc/sessmove/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/sessmove", dest = "/usr/bin/sessmove", mode = "755" },
    { source = "target/release/agentpath", dest = "/usr/bin/agentpath", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/sessmove/README.md", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/sessmove/LICENSE", mode = "644" },
]
